server:
  port: 0

spring:
  cloud:
    loadbalancer:
      retry:
        enabled: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
          inventory-service:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: BASIC
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: dbuser
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

logging:
  level:
    ru.yandex.practicum.order.client.InventoryClient: DEBUG